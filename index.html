<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHOCO CRAFT | ช็อกโกแลตแท่งคราฟต์แท้</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #printContainer, #printContainer * { visibility: visible; }
      #printContainer { position: absolute; left: 0; top: 0; width: 100%; }
      .shipping-label {
        width: 100mm; height: 145mm; border: 2px solid #000;
        padding: 12px; margin-bottom: 10mm; page-break-after: always; box-sizing: border-box;
      }
    }
  </style>
</head>
<body class="bg-[#FDF8F5] text-stone-800">

  <!-- แถบเมนูด้านบน -->
  <nav class="bg-stone-950 text-amber-100 px-4 py-3 flex justify-between items-center sticky top-0 z-50 shadow">
    <div class="font-bold tracking-wider text-lg cursor-pointer" onclick="switchView('shop')">🍫 CHOCO CRAFT</div>
    <div class="flex gap-2">
      <button id="btnShopView" onclick="switchView('shop')" class="hidden bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">
        🛍️ กลับหน้าร้านค้า
      </button>
      <button id="btnAdminView" onclick="openAdmin()" class="bg-stone-800 hover:bg-stone-700 text-amber-200 px-3 py-1.5 rounded-lg text-xs border border-stone-700">
        📦 หลังบ้าน / แพ็คพัสดุ
      </button>
    </div>
  </nav>

  <!-- หน้า LANDING PAGE (สำหรับลูกค้า) -->
  <div id="shopSection">
    <header class="bg-stone-900 text-amber-50 py-10 px-4 text-center">
      <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold">Bean-to-Bar Craft Chocolate</span>
      <h1 class="text-3xl md:text-5xl font-bold mt-2">CHOCO CRAFT</h1>
      <p class="text-stone-300 mt-2 max-w-xl mx-auto text-sm">ช็อกโกแลตแท่งแท้ เข้มข้น ละมุนลิ้น ส่งตรงความอร่อยถึงหน้าบ้านคุณ</p>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
      <h2 class="text-2xl font-bold text-center mb-6">เลือกรสชาติช็อกโกแลตแท่ง (ขนาด 85g)</h2>
      
      <!-- รายการสินค้า 3 SKUs (ดึงรูปจากโฟลเดอร์ images ใน GitHub) -->
      <div class="grid md:grid-cols-3 gap-6 mb-10">
        <!-- SKU-01 -->
        <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden flex flex-col">
          <img src="./images/sku1.jpg" alt="75% Dark Chocolate" class="w-full h-52 object-cover bg-stone-200">
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold bg-stone-900 text-amber-300 px-2.5 py-0.5 rounded">SKU-01</span>
                <span class="text-lg font-bold text-amber-900">฿160</span>
              </div>
              <h3 class="font-bold text-lg">75% Chumphon Dark</h3>
              <p class="text-xs text-stone-500 mt-1">ดาร์กช็อกโกแลตแท้จากชุมพร เข้มข้น หวานน้อย หอมโกโก้คั่ว</p>
            </div>
            <div class="flex items-center justify-between mt-4 pt-3 border-t">
              <span class="text-sm font-medium">จำนวน:</span>
              <div class="flex items-center gap-2">
                <button type="button" onclick="updateQty('sku01', -1)" class="w-8 h-8 rounded-full bg-stone-2
